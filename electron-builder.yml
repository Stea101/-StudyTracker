appId: com.studytracker.app
productName: StudyTracker
directories:
  output: dist

# 只打包编译产物，node_modules 中无运行时依赖，体积最小、最稳定
files:
  - out/**/*
  - package.json

win:
  executableName: StudyTracker
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: StudyTracker-Setup-${version}.${ext}
  shortcutName: StudyTracker
  uninstallDisplayName: StudyTracker
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
